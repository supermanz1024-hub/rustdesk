name: Custom RustDesk Build

# ===================================================================
# Custom RustDesk Client Build Workflow
# ===================================================================
# This workflow runs entirely on GitHub. No local operations needed.
#
# It automatically:
#   1. Checks out the official RustDesk source code + submodules
#   2. Inlines the hbb_common submodule (single-repo, no submodule fork needed)
#   3. Applies all custom patches (server IP, key, adaptive view, de-brand)
#   4. Modifies flutter-build.yml to only build 3 platforms
#   5. Commits, pushes, and creates a tag
#   6. The tag triggers the official Flutter Tag Build workflow
#   7. Artifacts are uploaded automatically
#
# Target platforms:
#   - Windows x64
#   - Linux AMD64 (.deb)
#   - Linux ARM64 (.deb)
#
# Usage:
#   1. Fork https://github.com/rustdesk/rustdesk on GitHub
#   2. Enable Actions: Settings -> Actions -> General -> Allow all actions
#   3. Set permissions: Settings -> Actions -> General -> Workflow permissions -> Read and write
#   4. Create this file at .github/workflows/custom-build.yml (via GitHub web editor)
#   5. Go to Actions tab -> "Custom RustDesk Build" -> Run workflow
#   6. Wait for "Flutter Tag Build" to complete (40-90 min)
#   7. Download artifacts from Actions run or Releases page
# ===================================================================

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Inline hbb_common submodule
        run: |
          # Convert submodule to regular directory so all code is in one repo
          rm -rf .git/modules/libs/hbb_common
          rm -f libs/hbb_common/.git
          rm -f .gitmodules
          git rm --cached libs/hbb_common 2>/dev/null || true
          echo "✅ hbb_common inlined"

      - name: Apply custom patches
        run: |
          python3 << 'PYEOF'
          import re, sys

          errors = []

          def patch(filepath, old, new, desc):
              """Exact string replacement."""
              try:
                  content = open(filepath, encoding='utf-8').read()
                  if old in content:
                      content = content.replace(old, new)
                      open(filepath, 'w', encoding='utf-8').write(content)
                      print(f"  ✅ {desc}")
                  else:
                      errors.append(f"  ⚠ {filepath}: {desc} - pattern not found")
              except FileNotFoundError:
                  errors.append(f"  ⚠ {filepath}: file not found")

          def patch_re(filepath, pattern, replacement, desc):
              """Regex replacement."""
              try:
                  content = open(filepath, encoding='utf-8').read()
                  new_content = re.sub(pattern, replacement, content)
                  if new_content != content:
                      open(filepath, 'w', encoding='utf-8').write(new_content)
                      print(f"  ✅ {desc}")
                  else:
                      errors.append(f"  ⚠ {filepath}: {desc} - regex not matched")
              except FileNotFoundError:
                  errors.append(f"  ⚠ {filepath}: file not found")

          print("=== Applying Custom Patches ===\n")

          # ─── 1. config.rs: Server IP + Key + Adaptive View ───
          print("[1/6] libs/hbb_common/src/config.rs")
          patch('libs/hbb_common/src/config.rs',
                'rs-ny.rustdesk.com', '10.44.83.80',
                'Server IP -> 10.44.83.80')
          patch('libs/hbb_common/src/config.rs',
                'OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=',
                'ahDigDjZ3sH7ihpknIwaqHdAp3u76nzLGi66LiDv9Ic=',
                'Server Key -> custom')
          patch_re('libs/hbb_common/src/config.rs',
                   r'(OPTION_VIEW_STYLE[^n]*?get_string\(key, )"[^"]*"',
                   r'\1"adaptive"',
                   'View style default -> adaptive')

          # ─── 2. common.rs: Disable update check + Custom API ───
          print("[2/6] src/common.rs")
          patch_re('src/common.rs',
                   r'(pub async fn do_check_software_update\(\) -> hbb_common::ResultType<\(\)> \{)',
                   r'\1\n    return Ok(());\n    #[allow(unreachable_code)]',
                   'Disable software update check')
          patch('src/common.rs',
                '"https://admin.rustdesk.com".to_owned()',
                '"http://10.44.83.80".to_owned()',
                'API URL -> 10.44.83.80')

          # ─── 3. desktop_setting_page.dart: Remove network/account/about ───
          print("[3/6] flutter/lib/desktop/pages/desktop_setting_page.dart")
          patch_re('flutter/lib/desktop/pages/desktop_setting_page.dart',
                   r'    if \(!bind\.isDisableSettings\(\) &&\n        bind\.mainGetBuildinOption\(key: kOptionHideNetworkSetting\) != \'Y\'\)\n      SettingsTabKey\.network,\n',
                   '',
                   'Remove network tab')
          patch_re('flutter/lib/desktop/pages/desktop_setting_page.dart',
                   r'    if \(!bind\.isDisableAccount\(\)\) SettingsTabKey\.account,\n',
                   '',
                   'Remove account tab')
          patch_re('flutter/lib/desktop/pages/desktop_setting_page.dart',
                   r'    SettingsTabKey\.about,\n',
                   '',
                   'Remove about tab')

          # ─── 4. connection_page.dart: Hide public server notice ───
          print("[4/6] flutter/lib/desktop/pages/connection_page.dart")
          patch('flutter/lib/desktop/pages/connection_page.dart',
                '_svcIsUsingPublicServer = true.obs',
                '_svcIsUsingPublicServer = false.obs',
                'Hide public server notice')

          # ─── 5. flutter-build.yml: Disable unwanted jobs ───
          print("[5/6] .github/workflows/flutter-build.yml")
          f = '.github/workflows/flutter-build.yml'
          content = open(f, encoding='utf-8').read()

          # Disable unwanted jobs by adding/replacing if: false
          jobs_to_disable = [
              'build-for-windows-sciter',
              'build-rustdesk-ios',
              'build-for-macOS',
              'build-rustdesk-android',
              'build-rustdesk-android-universal',
              'build-rustdesk-linux-sciter',
              'build-appimage',
              'build-flatpak',
              'publish_unsigned',
          ]

          lines = content.split('\n')
          new_lines = []
          i = 0
          disabled_count = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              matched = False
              for job in jobs_to_disable:
                  if stripped == f'{job}:' and line.startswith('  '):
                      new_lines.append(line)
                      i += 1
                      if i < len(lines) and lines[i].strip().startswith('if:'):
                          new_lines.append('    if: false')
                          i += 1
                      else:
                          new_lines.append('    if: false')
                      disabled_count += 1
                      matched = True
                      break
              if not matched:
                  new_lines.append(line)
                  i += 1

          content = '\n'.join(new_lines)
          print(f"  ✅ Disabled {disabled_count} unwanted jobs")

          # Remove Windows ARM64 from build-for-windows-flutter matrix
          content = re.sub(
              r'\n          - \{\n              target: aarch64-pc-windows-msvc,.*?\n            \}\n',
              '\n',
              content,
              flags=re.DOTALL
          )
          print("  ✅ Removed Windows ARM64 matrix entry")

          # Add write permissions if not present
          if 'permissions:' not in content.split('jobs:')[0]:
              content = content.replace('jobs:', 'permissions:\n  contents: write\n\njobs:', 1)
              print("  ✅ Added write permissions")

          open(f, 'w', encoding='utf-8').write(content)

          # ─── 6. flutter-tag.yml: Add permissions ───
          print("[6/6] .github/workflows/flutter-tag.yml")
          f = '.github/workflows/flutter-tag.yml'
          content = open(f, encoding='utf-8').read()
          if 'permissions:' not in content.split('jobs:')[0]:
              content = content.replace('jobs:', 'permissions:\n  contents: write\n\njobs:', 1)
              open(f, 'w', encoding='utf-8').write(content)
              print("  ✅ Added write permissions")
          else:
              print("  ⏭ Permissions already set")

          # ─── Summary ───
          print("\n=== Patch Summary ===")
          if errors:
              print("⚠ Some patches had issues:")
              for e in errors:
                  print(e)
              sys.exit(1)
          else:
              print("✅ All patches applied successfully!")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "Custom Build Bot"
          git config user.email "bot@custom.local"
          git add -A
          git commit -m "Custom RustDesk: server 10.44.83.80, adaptive view, de-brand, 3-platform build"
          git push
          echo "✅ Changes pushed"

      - name: Create tag to trigger build
        run: |
          TAG="1.4.9-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "✅ Tag $TAG created - Flutter Tag Build will start automatically"
          echo "::notice::Tag $TAG created. Check 'Flutter Tag Build' workflow in Actions tab."

      - name: Build summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🎉 Custom RustDesk Build Triggered!

          **Tag:** ${{ env.TAG }}

          The **Flutter Tag Build** workflow has been automatically triggered.
          It will build 3 platforms (expect 40-90 minutes):

          | Platform | Artifact Name | Format |
          |----------|--------------|--------|
          | Windows x64 | `rustdesk-unsigned-windows-x86_64` | Folder (.exe) |
          | Linux AMD64 | `rustdesk-1.4.9-x86_64.deb` | .deb |
          | Linux ARM64 | `rustdesk-1.4.9-aarch64.deb` | .deb |

          ### 📦 How to download:
          1. **Actions** tab → latest "Flutter Tag Build" run → Artifacts section
          2. **Releases** page (for .deb / .rpm files)

          ### 🔧 Customizations applied:
          - Server: `10.44.83.80`
          - Key: `ahDigDjZ3sH7ihpknIwaqHdAp3u76nzLGi66LiDv9Ic=`
          - View style: **adaptive** (auto-fit window)
          - Update check: **disabled**
          - Official content: **removed** (network/account/about tabs, public server banner)
          - Remote control: **fully preserved** (connect + be connected)
          EOF
